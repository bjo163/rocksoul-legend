name: Materialize LEGEND lockfile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11.6.0
      - run: npm install
      - name: Commit reproducible dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
          else
            git commit -m "build: lock LEGEND dependency graph"
            git push origin HEAD:main
          fi
