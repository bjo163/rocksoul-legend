name: Validate LEGEND

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11.6.0
      - run: npm install
      - run: npm run build
      - name: Ensure generated index is current
        run: git diff --exit-code -- data/index.json
