name: Validate LEGEND

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run ci
      - name: Ensure generated index is current
        run: git diff --exit-code -- data/index.json
      - name: Browser smoke
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/legend-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /tmp/legend-root.html; then break; fi
            sleep 1
          done
          grep -q "LEGEND" /tmp/legend-root.html
          curl -fsS http://127.0.0.1:4173/events/EVT-JERUSALEM-SECOND-TEMPLE-DESTRUCTION-70/ | grep -q "Jerusalem"
      - name: Axe accessibility gate
        run: |
          npx axe http://127.0.0.1:4173/ http://127.0.0.1:4173/events/EVT-JERUSALEM-SECOND-TEMPLE-DESTRUCTION-70/ --exit --chrome-options=no-sandbox,disable-dev-shm-usage
      - name: Enforce main-only remote branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(
            git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | sort
          )
          for branch in "${branches[@]}"; do
            if [ "$branch" != "main" ]; then
              echo "Deleting noncanonical remote branch: $branch"
              git push origin --delete "$branch"
            fi
          done
          remaining=$(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | sort)
          printf 'Remaining branches:\n%s\n' "$remaining"
          test "$remaining" = "main"
